name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true
      - run: go mod download
      - run: make check

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: launlog_ci
          POSTGRES_USER: launlog
          POSTGRES_PASSWORD: launlog_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launlog -d launlog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_ci?sslmode=disable
      DATABASE_URL: postgresql://launlog_runtime:runtime_ci_only@localhost:5432/launlog_ci?sslmode=disable
      MIGRATION_DATABASE_URL: postgresql://launlog_migrator:migrator_ci_only@localhost:5432/launlog_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://launlog_runtime:runtime_ci_only@localhost:5432/launlog_ci?sslmode=disable
      TEST_ADMIN_DATABASE_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_ci?sslmode=disable
      TEST_EXPECT_LEAST_PRIVILEGE: "true"
      E2E_DATABASE_URL: postgresql://launlog_runtime:runtime_ci_only@localhost:5432/launlog_ci?sslmode=disable
      UPGRADE_MIGRATION_DATABASE_URL: postgresql://launlog_migrator:migrator_ci_only@localhost:5432/launlog_upgrade?sslmode=disable
      UPGRADE_ADMIN_DATABASE_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_upgrade?sslmode=disable
      BACKUP_SOURCE_DATABASE_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_ci?sslmode=disable
      RESTORE_DATABASE_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_restore?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true
      - name: Provision non-superuser migration and runtime roles
        run: |
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE launlog_migrator LOGIN PASSWORD 'migrator_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE launlog_runtime LOGIN PASSWORD 'runtime_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE launlog_upgrade;
          CREATE DATABASE launlog_restore;
          GRANT CONNECT ON DATABASE launlog_ci TO launlog_migrator, launlog_runtime;
          GRANT CONNECT ON DATABASE launlog_upgrade TO launlog_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO launlog_migrator;
          GRANT USAGE ON SCHEMA public TO launlog_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE launlog_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO launlog_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE launlog_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO launlog_runtime;
          SQL
          psql "$UPGRADE_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'GRANT USAGE, CREATE ON SCHEMA public TO launlog_migrator'
      - run: make migrate-verify
      - name: Apply runtime grants and protect immutable audit rows
        run: psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -v database_name=launlog_ci -f db/roles/least_privilege.sql
      - run: make test-integration-required
      - run: make migrate-upgrade-check
      - run: make backup-restore-check
      - run: make e2e-smoke
