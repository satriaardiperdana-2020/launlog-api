name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true
      - run: go mod download
      - run: make check

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: launlog_ci
          POSTGRES_USER: launlog
          POSTGRES_PASSWORD: launlog_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launlog -d launlog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://launlog:launlog_ci_only@localhost:5432/launlog_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true
      - run: make migrate-verify
