      nullable: true
      default: Asia/Jakarta
      description: Omitted, null, empty, or whitespace becomes Asia/Jakarta, including on PUT. Non-empty names are trimmed and validated; Local and unknown timezones are rejected with INVALID_TIMEZONE (400).
    Outlet:
      type: object
      required: [id, business_id, code, name, timezone, is_active, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/EntityId" }
        business_id: { $ref: "#/components/schemas/EntityId" }
        code: { type: string }
        timezone: { $ref: '#/components/schemas/OutletTimezone' }
        name: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/JakartaDateTime" }
        updated_at: { $ref: "#/components/schemas/JakartaDateTime" }
    OutletCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        timezone: { $ref: '#/components/schemas/OutletTimezoneInput' }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 32, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
    OutletUpdate:
      allOf:
        - $ref: "#/components/schemas/OutletCreate"
        - type: object
          required: [isActive]
          properties:
            isActive: { type: boolean }
    OutletList:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Outlet" } }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
    OutletDashboard:
      type: object
      required: [outlet, business_date, timezone, payments, expenses]
      properties:
        outlet: { $ref: "#/components/schemas/Outlet" }
        business_date: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Jakarta] }
        payments:
          type: object
          required: [confirmed_count, confirmed_total_amount]
          properties:
            confirmed_count: { type: integer, format: int64, minimum: 0 }
            confirmed_total_amount: { type: integer, format: int64, minimum: 0, description: Exact whole rupiah from confirmed received payments. Gross receipts; refunds are not implemented by this endpoint. }
        expenses:
          type: object
          required: [count, total_amount]
          properties:
            count: { type: integer, format: int64, minimum: 0 }
            total_amount: { type: integer, format: int64, minimum: 0, description: Exact whole rupiah from expenses whose expense_at falls within the local day. }
    ReportDateRange:
      type: object
      required: [from_date, to_date, timezone]
      properties:
        from_date: { $ref: "#/components/schemas/LocalDate" }
        to_date: { $ref: "#/components/schemas/LocalDate" }
        timezone: { type: string, enum: [Asia/Jakarta] }
    ReportDailyBase:
      type: object
      required: [date]
      properties:
        date: { $ref: "#/components/schemas/LocalDate" }
    IncomeReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, daily, by_method]
          properties:
            summary:
              type: object
              required: [payment_count, received_amount]
              properties:
                payment_count: { type: integer, format: int64, minimum: 0 }
                received_amount: { $ref: "#/components/schemas/RupiahAmount" }
            daily:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ReportDailyBase" }
                  - type: object
                    required: [payment_count, received_amount]
                    properties:
                      payment_count: { type: integer, format: int64, minimum: 0 }
                      received_amount: { $ref: "#/components/schemas/RupiahAmount" }
            by_method:
              type: array
              items:
                type: object
                required: [method, payment_count, received_amount]
                properties:
                  method: { type: string, enum: [CASH, BCA_TRANSFER, QRIS] }
                  payment_count: { type: integer, format: int64, minimum: 0 }
                  received_amount: { $ref: "#/components/schemas/RupiahAmount" }
    ExpenseReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, daily]
          properties:
            summary:
              type: object
              required: [expense_count, expense_amount]
              properties:
                expense_count: { type: integer, format: int64, minimum: 0 }
                expense_amount: { $ref: "#/components/schemas/RupiahAmount" }
            daily:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ReportDailyBase" }
                  - type: object
                    required: [expense_count, expense_amount]
                    properties:
                      expense_count: { type: integer, format: int64, minimum: 0 }
                      expense_amount: { $ref: "#/components/schemas/RupiahAmount" }
    ProfitLossReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, daily]
          properties:
            summary:
              type: object
              required: [received_amount, expense_amount, profit_loss_amount]
              properties:
                received_amount: { $ref: "#/components/schemas/RupiahAmount" }
                expense_amount: { $ref: "#/components/schemas/RupiahAmount" }
                profit_loss_amount: { type: integer, format: int64, description: May be negative; exact whole rupiah. }
            daily:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ReportDailyBase" }
                  - type: object
                    required: [received_amount, expense_amount, profit_loss_amount]
                    properties:
                      received_amount: { $ref: "#/components/schemas/RupiahAmount" }
                      expense_amount: { $ref: "#/components/schemas/RupiahAmount" }
                      profit_loss_amount: { type: integer, format: int64, description: May be negative; exact whole rupiah. }
    OrderReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, daily]
          properties:
            summary:
              type: object
              required: [order_count, order_value_amount, collected_amount, outstanding_balance_amount, cancelled_count, cancelled_order_value_amount]
              properties:
                order_count: { type: integer, format: int64, minimum: 0 }
                order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
                collected_amount: { $ref: "#/components/schemas/RupiahAmount" }
                outstanding_balance_amount: { $ref: "#/components/schemas/RupiahAmount" }
                cancelled_count: { type: integer, format: int64, minimum: 0 }
                cancelled_order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
            daily:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ReportDailyBase" }
                  - type: object
                    required: [order_count, order_value_amount, collected_amount, outstanding_balance_amount, cancelled_count, cancelled_order_value_amount]
                    properties:
                      order_count: { type: integer, format: int64, minimum: 0 }
                      order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
                      collected_amount: { $ref: "#/components/schemas/RupiahAmount" }
                      outstanding_balance_amount: { $ref: "#/components/schemas/RupiahAmount" }
                      cancelled_count: { type: integer, format: int64, minimum: 0 }
                      cancelled_order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
    CancellationReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, daily]
          properties:
            summary:
              type: object
              required: [cancellation_count, cancelled_order_value_amount]
              properties:
                cancellation_count: { type: integer, format: int64, minimum: 0 }
                cancelled_order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
            daily:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ReportDailyBase" }
                  - type: object
                    required: [cancellation_count, cancelled_order_value_amount]
                    properties:
                      cancellation_count: { type: integer, format: int64, minimum: 0 }
                      cancelled_order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
    CustomerReport:
      allOf:
        - { $ref: "#/components/schemas/ReportDateRange" }
        - type: object
          required: [summary, top_customers]
          properties:
            summary:
              type: object
              required: [distinct_customer_count]
              properties:
                distinct_customer_count: { type: integer, format: int64, minimum: 0 }
            top_customers:
              type: array
              maxItems: 10
              items:
                type: object
                required: [customer_id, name, order_count, order_value_amount]
                properties:
                  customer_id: { $ref: "#/components/schemas/EntityId" }
                  name: { type: string }
                  order_count: { type: integer, format: int64, minimum: 1 }
                  order_value_amount: { $ref: "#/components/schemas/RupiahAmount" }
    Staff:
      type: object
      required: [id, businessId, email, fullName, role, isActive, outletIds, permissions]
      properties:
        id: { $ref: "#/components/schemas/EntityId" }
        businessId: { $ref: "#/components/schemas/EntityId" }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        isActive: { type: boolean }
        outletIds: { type: array, items: { $ref: "#/components/schemas/EntityId" } }
        permissions: { type: array, items: { type: string } }
    StaffCreate:
      type: object
      additionalProperties: false
      required: [email, fullName, password, outletIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: New-password character policy; server additionally enforces bcrypt's 72 UTF-8 byte limit.
        outletIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/EntityId" }
    StaffUpdate:
      type: object
      additionalProperties: false
      required: [fullName, isActive]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        isActive: { type: boolean }
    StaffList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, business_id, email, full_name, role, is_active]
            properties:
              id: { $ref: "#/components/schemas/EntityId" }
              business_id: { $ref: "#/components/schemas/EntityId" }
              email: { type: string, format: email }
              full_name: { type: string }
              role: { $ref: "#/components/schemas/UserRole" }
              is_active: { type: boolean }
              created_at: { $ref: "#/components/schemas/JakartaDateTime" }
              updated_at: { $ref: "#/components/schemas/JakartaDateTime" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
    OutletAssignmentRequest:
      type: object
      additionalProperties: false
      required: [outletIds]
      properties:
        outletIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/EntityId" }
    OutletAssignmentResponse:
      type: object
      required: [userId, outletIds]
      properties:
        userId: { $ref: "#/components/schemas/EntityId" }
        outletIds:
          type: array
          items: { $ref: "#/components/schemas/EntityId" }
    Permission:
      type: object
      required: [code, description]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
        description: { type: string }
    PermissionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    PermissionGrantSetRequest:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
    PermissionGrantSetResponse:
      type: object
      required: [userId, permissions]
      properties:
        userId: { $ref: "#/components/schemas/EntityId" }
        permissions:
          type: array
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
