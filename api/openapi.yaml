openapi: 3.0.3
info:
  title: Launlog API
  version: 0.1.0
  description: |
    Backend API contract for the Launlog laundry POS.

    Date-time values use RFC 3339 with an explicit UTC offset. Business-facing
    timestamps use the Asia/Jakarta timezone (`+07:00`). Date-only values use
    ISO 8601 `YYYY-MM-DD`.

    Rupiah amounts are JSON integers in whole rupiah. Decimal quantities are
    encoded as strings with up to three fractional digits to avoid floating-point
    precision loss.
servers:
  - url: /
    description: Current API server

tags:
  - name: Health
    description: Application dependency status
  - name: Authentication
    description: Session and current-user operations
  - name: Outlets and staff
    description: Business-scoped outlet, staff, and permission administration (ADMIN only)
  - name: Customers
    description: Business-scoped customer directory and paginated order history
  - name: Services
    description: Business-shared service catalog; unit is the measurement type
  - name: Perfumes
    description: Business-scoped optional perfume catalog for order items
  - name: Orders
    description: Transactional order creation, lifecycle, cancellation, invoices, and immutable item snapshots
  - name: Payments
    description: Confirmed cash, BCA transfer, and QRIS payment receipts and order balances
  - name: Expenses
    description: Business expense categories and outlet expense records
  - name: Dashboard
    description: Outlet profile and current-day confirmed payment and expense totals

paths:
  /expense-categories:
    get:
      operationId: listExpenseCategories
      summary: List expense categories in the authenticated business
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string }
        - name: includeInactive
          in: query
          description: Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Expense category page., content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategoryList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createExpenseCategory
      summary: Create an expense category
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategoryInput" } } }
      responses:
        "201": { description: Category created., content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategory" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /expense-categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getExpenseCategory
      summary: Get an expense category
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Category details., content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategory" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: updateExpenseCategory
      summary: Update or deactivate an expense category
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategoryUpdate" } } }
      responses:
        "200": { description: Category updated., content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategory" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /expenses:
    get:
      operationId: listExpenses
      summary: List expenses, defaulting to today in Asia/Jakarta
      description: Filters and reports use expense_at, never created_at. fromDate and toDate are inclusive local dates; omitted dates default to today in Asia/Jakarta. Staff see only currently assigned active outlets.
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: outletId
          in: query
          schema: { $ref: "#/components/schemas/EntityId" }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Expense page and applied local date range., content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createExpense
      summary: Record an expense
      description: Expense amount is positive whole rupiah. Outlet, active category, actor, and tenant are validated transactionally.
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCreateInput" } } }
      responses:
        "201":
          description: Expense recorded with redacted audit data in the same transaction.
          headers: { ETag: { schema: { type: string }, description: Current optimistic-concurrency version. } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getExpense
      summary: Get an expense in the authenticated business and outlet scope
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Expense details.
          headers: { ETag: { schema: { type: string }, description: Current optimistic-concurrency version. } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: updateExpense
      summary: Update an expense using optimistic concurrency
      description: If-Match must contain the quoted version returned in the ETag response header. A stale version returns 409 and does not overwrite the intervening update.
      tags: [Expenses]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseUpdateInput" } } }
      responses:
        "200":
          description: Expense updated and audited transactionally.
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428":
          description: If-Match is missing or malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders:
    get:
      operationId: listOrders
      summary: List orders available to the authenticated user
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: outletId
          in: query
          schema: { $ref: "#/components/schemas/EntityId" }
          description: Optional outlet filter; staff can query only currently assigned active outlets.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Order page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createOrder
      summary: Create an order and allocate an invoice atomically
      description: Prices are read from active services. Quantity uses NUMERIC(12,3); each line total is exact quantity times snapshot unit price rounded to a whole rupiah using PostgreSQL numeric round (half away from zero), and the order total is the sum of rounded line totals. One optional perfume applies to the whole order. An omitted perfume has NULL ID and name snapshots. Payment status begins UNPAID.
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client key scoped to the authenticated business and outlet. Reusing it with the same decoded payload returns the existing order; a different payload returns 409.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderInput" }
      responses:
        "201":
          description: Order created (or existing order returned for an idempotent replay).
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getOrder
      summary: Get an order and its immutable item snapshots
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Order details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    patch:
      operationId: transitionOrderStatus
      summary: Advance an order through its allowed lifecycle
      description: "Allowed transitions only: RECEIVED→PROCESSING, PROCESSING→READY_FOR_PICKUP, READY_FOR_PICKUP→COMPLETED. Cancellation uses the separate cancellation operation. COMPLETED and CANCELLED are terminal."
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusTransitionInput" }
      responses:
        "200":
          description: Transition committed with history and audit records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderLifecycleResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}/cancel:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    post:
      operationId: cancelOrder
      summary: Cancel an unpaid order and retain it as soft-deleted history
      description: "Cancellation is allowed from RECEIVED, PROCESSING, and READY_FOR_PICKUP only when payment_status is UNPAID. Paid or partially paid cancellation returns 409 until a refund policy and implementation are approved. Cancellation reason is mandatory."
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOrderInput" }
      responses:
        "200":
          description: Cancellation committed with history and audit records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderLifecycleResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}/status-history:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getOrderStatusHistory
      summary: Get append-only status history for an order
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Status history in chronological order, including cancellation when applicable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatusHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}/payments:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: listOrderPayments
      summary: List payment receipts and outstanding balance for an order
      tags: [Payments]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Payment history and exact whole-rupiah balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPaymentSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: recordOrderPayment
      summary: Record a confirmed cash, BCA transfer, or QRIS receipt
      description: "Idempotency keys are scoped to business, outlet, and order. Amount is an integer rupiah tendered/received. CASH applies at most the current outstanding balance and returns excess as change; only the applied amount is stored as order revenue. BCA_TRANSFER and QRIS amounts above the balance are rejected. Recording a receipt does not call a bank or QRIS provider."
      tags: [Payments]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Reusing the same key and request payload returns the existing receipt; a different payload returns 409.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPaymentInput" }
      responses:
        "201":
          description: Confirmed receipt recorded, or existing receipt returned for an idempotent replay.
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecordResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /orders/{orderId}/payments/{paymentId}/void:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
      - name: paymentId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    post:
      operationId: voidOrderPayment
      summary: Void an erroneous confirmed receipt entry
      description: "Voiding is an accounting correction, not a refund or cash/bank transfer. It requires a reason, retains the payment row, and recalculates the order balance transactionally."
      tags: [Payments]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidPaymentInput" }
      responses:
        "200":
          description: Payment voided and outstanding balance recalculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentVoidResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /perfumes:
    get:
      operationId: listPerfumes
      summary: Search perfumes in the authenticated business
      tags: [Perfumes]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring search over perfume name and description.
        - name: isActive
          in: query
          schema: { type: boolean }
          description: Omit to include both active and inactive perfumes. Soft-deleted perfumes are excluded.
      responses:
        "200":
          description: Perfume page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfumeList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createPerfume
      summary: Create a perfume catalog entry
      tags: [Perfumes]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePerfumeInput" }
      responses:
        "201":
          description: Perfume created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /perfumes/{perfumeId}:
    parameters:
      - name: perfumeId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getPerfume
      summary: Get a perfume in the authenticated business
      tags: [Perfumes]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Perfume details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: updatePerfume
      summary: Update a perfume and its active state
      description: Existing order items retain the name snapshot recorded when the order is created.
      tags: [Perfumes]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePerfumeInput" }
      responses:
        "200":
          description: Perfume updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      operationId: deletePerfume
      summary: Soft-delete a perfume while retaining order references
      tags: [Perfumes]
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Perfume deactivated and soft-deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /services:
    get:
      operationId: listServices
      summary: Search and filter services in the authenticated business
      tags: [Services]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring search over name and description.
        - name: unit
          in: query
          schema: { $ref: "#/components/schemas/ServiceUnit" }
        - name: isActive
          in: query
          schema: { type: boolean }
          description: Omit to include active and inactive services; soft-deleted services are excluded.
      responses:
        "200":
          description: Service page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createService
      summary: Create a business-shared service
      tags: [Services]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceInput" }
      responses:
        "201":
          description: Service created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getService
      summary: Get a service in the authenticated business
      tags: [Services]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Service details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: updateService
      summary: Replace editable fields and activate or deactivate a service
      description: Setting isActive to false deactivates the service; existing order-item snapshots are never rewritten.
      tags: [Services]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceInput" }
      responses:
        "200":
          description: Service updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      operationId: deleteService
      summary: Soft-delete a service without removing historical references
      tags: [Services]
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Service soft-deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /livez:
    get:
      operationId: getLiveness
      summary: Check whether the HTTP process is live
      description: Does not contact PostgreSQL and is safe for process liveness probes.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API is ready to serve database-backed requests
      tags:
        - Health
      security: []
      responses:
        "200":
          description: PostgreSQL is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailableResponse"

  /health:
    get:
      operationId: getHealth
      summary: Compatibility readiness check
      description: Alias for `/readyz`; reports whether PostgreSQL is available.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Application and PostgreSQL are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailableResponse"

  /auth/login:
    post:
      operationId: login
      summary: Authenticate a user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh an authentication session
      description: Rotates a valid refresh token and returns a new token pair. Reuse of a consumed token revokes its entire session family.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token accepted and rotated; returns the same session envelope as login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current authentication session
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Session revoked successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user and authorization context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /customers:
    get:
      operationId: listCustomers
      summary: Search or list customers in the authenticated business
      tags: [Customers]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search over customer name and phone.
          schema: { type: string }
      responses:
        "200":
          description: Customer page and pagination metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createCustomer
      summary: Create a customer in the authenticated business
      tags: [Customers]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EntityId" }
    get:
      operationId: getCustomer
      summary: Get an active customer in the authenticated business
      tags: [Customers]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Customer details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: updateCustomer
