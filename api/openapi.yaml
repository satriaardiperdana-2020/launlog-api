        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
          description: Opaque refresh token issued by the login or refresh operation.

    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
          description: Refresh token for the session that will be revoked.

