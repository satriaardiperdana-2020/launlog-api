          format: email
          maxLength: 254
          example: admin@launlog.id
        password:
          type: string
          format: password
          writeOnly: true
          description: Existing credentials are checked as stored. New or changed passwords require 8 to 128 Unicode characters and at most 72 UTF-8 bytes for bcrypt. The character policy is not imposed retroactively at login.

    RefreshRequest:
      type: object
      additionalProperties: false
      required:
