          type: string
          readOnly: true
        refreshToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        accessTokenExpiresAt:
          allOf:
            - $ref: "#/components/schemas/JakartaDateTime"
          readOnly: true
        refreshTokenExpiresAt:
          allOf:
            - $ref: "#/components/schemas/JakartaDateTime"
