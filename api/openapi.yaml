        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/InternalServerError'}
components:
  securitySchemes:
    PlatformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Platform JWT access token with the launlog-platform audience."
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token supplied as `Authorization: Bearer <token>`."

  parameters:
    OutletId:
      name: outletId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityId" }
    ReportFromDate:
      name: fromDate
      in: query
      required: false
      description: Inclusive YYYY-MM-DD business-local date. Omitted together with toDate, defaults to today in Asia/Jakarta. Maximum range is 366 calendar days.
      schema: { $ref: "#/components/schemas/LocalDate" }
    ReportToDate:
      name: toDate
      in: query
      required: false
      description: Inclusive YYYY-MM-DD business-local date. A lone bound selects one day; maximum range is 366 calendar days.
      schema: { $ref: "#/components/schemas/LocalDate" }
    Page:
      name: page
      in: query
      description: One-based page number.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of records per page, capped at 100.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing, expired, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist in the authenticated business.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with a business invariant or unique constraint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests were made in the allowed time window.
      headers:
        Retry-After:
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The authentication request body exceeds 4096 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    BusinessAuditPage:
      type: object
      required: [items, pagination]
      properties:
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
        items:
          type: array
          items:
            type: object
            required: [id, business_id, action, entity_type, occurred_at]
            properties:
              id: {type: integer, format: int64}
              business_id: {type: integer, format: int64}
              outlet_id: {type: integer, format: int64, nullable: true}
              actor_user_id: {type: integer, format: int64, nullable: true}
              actor_platform_admin_id: {type: integer, format: int64, nullable: true}
              support_session_id: {type: integer, format: int64, nullable: true}
              platform_audit_id: {type: integer, format: int64, nullable: true}
              action: {type: string}
              entity_type: {type: string}
              entity_id: {type: integer, format: int64, nullable: true}
              occurred_at: {type: string, format: date-time}

    PlatformBusiness:
      type: object
      required: [id, name, timezone, is_active, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        timezone: {type: string, enum: [Asia/Jakarta]}
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlatformBusinessDetail:
      type: object
      required: [business, outletCount, activeAdminCount]
      properties:
        business: {$ref: '#/components/schemas/PlatformBusiness'}
        outletCount: {type: integer, format: int64}
        activeAdminCount: {type: integer, format: int64}
    PlatformOutlet:
      type: object
      required: [id, business_id, code, name, timezone, is_active]
      properties:
        id: {type: integer, format: int64}
        business_id: {type: integer, format: int64}
        code: {type: string}
        timezone: { $ref: '#/components/schemas/OutletTimezone' }
        name: {type: string}
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProvisionBusinessRequest:
      type: object
      additionalProperties: false
      required: [business, firstOutlet, firstAdmin]
      properties:
        business:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 200}
            phone: {type: string, nullable: true, maxLength: 32}
            address: {type: string, nullable: true, maxLength: 500}
        firstOutlet:
          type: object
          additionalProperties: false
          required: [code, name]
          properties:
            timezone: { $ref: '#/components/schemas/OutletTimezoneInput' }
            code: {type: string, minLength: 1, maxLength: 64}
            name: {type: string, minLength: 1, maxLength: 200}
            phone: {type: string, nullable: true, maxLength: 32}
            address: {type: string, nullable: true, maxLength: 500}
        firstAdmin:
          type: object
          additionalProperties: false
          required: [email, fullName, password]
          properties:
            email: {type: string, format: email, maxLength: 254}
            fullName: {type: string, minLength: 1, maxLength: 200}
            password: {type: string, format: password, writeOnly: true, minLength: 8, maxLength: 72}
    ProvisionBusinessResponse:
      type: object
      required: [business, firstOutlet, firstAdmin]
      properties:
        business: {$ref: '#/components/schemas/PlatformBusiness'}
        firstOutlet: {$ref: '#/components/schemas/PlatformOutlet'}
        firstAdmin:
          type: object
          required: [id, business_id, email, full_name, role, is_active]
          properties:
            id: {type: integer, format: int64}
            business_id: {type: integer, format: int64}
            email: {type: string, format: email}
            full_name: {type: string}
            role: {type: string, enum: [ADMIN]}
            is_active: {type: boolean}
    PlatformActivationRequest:
      type: object
      additionalProperties: false
      required: [isActive, reason]
      properties:
        isActive: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    OwnerSupportRequest:
      type: object
      additionalProperties: false
      required: [reason, accessScope, expiresAt, confirmationPassword]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        accessScope: {type: string, enum: [READ_ONLY, READ_WRITE]}
        expiresAt: {type: string, format: date-time, description: Future time no more than one hour away.}
        confirmationPassword: {type: string, format: password, writeOnly: true}
    StartSupportRequest:
      type: object
      additionalProperties: false
      required: [supportRequestId]
      properties:
        supportRequestId: {type: integer, format: int64, minimum: 1}
    SupportReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    SupportRequest:
      type: object
      required: [id, business_id, requested_by_user_id, reason, access_scope, created_at, expires_at]
      properties:
        id: {type: integer, format: int64}
        business_id: {type: integer, format: int64}
        requested_by_user_id: {type: integer, format: int64}
        reason: {type: string}
        access_scope: {type: string, enum: [READ_ONLY, READ_WRITE]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        revocation_reason: {type: string, nullable: true}
    SupportSession:
      type: object
      required: [id, business_id, support_request_id, platform_admin_id, platform_family_id, reason, access_scope, started_at, expires_at]
      properties:
        id: {type: integer, format: int64}
        business_id: {type: integer, format: int64}
        support_request_id: {type: integer, format: int64}
        platform_admin_id: {type: integer, format: int64}
        platform_family_id: {type: integer, format: int64}
        reason: {type: string}
        access_scope: {type: string, enum: [READ_ONLY, READ_WRITE]}
        started_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, nullable: true}
        end_reason: {type: string, nullable: true}
    SupportPerfume:
      type: object
      required: [id, business_id, name, is_active, version]
      properties:
        id: {type: integer, format: int64}
        business_id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string, nullable: true}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
    SupportDescriptionRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: {type: string, maxLength: 1000}
    SupportDiagnostics:
      type: object
      required: [outlets, users, perfumes]
      properties:
        outlets: {type: integer, format: int64}
        users: {type: integer, format: int64}
        perfumes: {type: integer, format: int64}
    PlatformAuditEntry:
      type: object
      required: [id, action, target_type, outcome, occurred_at, metadata]
      properties:
        id: {type: integer, format: int64}
        business_id: {type: integer, format: int64, nullable: true}
        actor_platform_admin_id: {type: integer, format: int64, nullable: true}
        support_session_id: {type: integer, format: int64, nullable: true}
        reason: {type: string, nullable: true}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: integer, format: int64, nullable: true}
        outcome: {type: string, enum: [SUCCESS, DENIED]}
        request_id: {type: string, nullable: true}
        metadata: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
    PlatformBusinessPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlatformBusiness'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    SupportOutletPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlatformOutlet'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    SupportPerfumePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SupportPerfume'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    SupportRequestPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SupportRequest'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    SupportSessionPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SupportSession'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    PlatformAuditPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlatformAuditEntry'}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    ReceiptPayload:
      type: object
      description: Historical order/customer/item snapshots plus current status, payment balance, outlet profile including timezone, and template settings.
      additionalProperties: true
    ReceiptTemplateInput:
      type: object
      additionalProperties: false
      required: [name, paperWidthMm]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        headerText: { type: string, maxLength: 2000, nullable: true }
        footerText: { type: string, maxLength: 2000, nullable: true }
        whatsappMessageTemplate: { type: string, maxLength: 4000, nullable: true, description: 'Allowed placeholders: {{customer_name}}, {{invoice_number}}, {{order_total}}, {{paid_amount}}, {{outstanding_amount}}, {{due_date}}, {{order_status}}. Character limits apply at the API boundary; values are validated and substituted as plain text.' }
        paperWidthMm: { type: integer, enum: [58, 80] }
        isDefault: { type: boolean, default: false }
    ReceiptTemplateUpdate:
      allOf:
        - $ref: "#/components/schemas/ReceiptTemplateInput"
      description: Full replacement; isDefault is required.
    ReceiptTemplate:
      type: object
      additionalProperties: false
      required: [id, outletId, name, paperWidthMm, isDefault, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/EntityId" }
        outletId: { $ref: "#/components/schemas/EntityId" }
        name: { type: string }
        headerText: { type: string, nullable: true }
        footerText: { type: string, nullable: true }
        whatsappMessageTemplate: { type: string, nullable: true }
        paperWidthMm: { type: integer, enum: [58, 80] }
        isDefault: { type: boolean }
        createdAt: { $ref: "#/components/schemas/JakartaDateTime" }
        updatedAt: { $ref: "#/components/schemas/JakartaDateTime" }

    EntityId:
      type: integer
      format: int64
      minimum: 1
      example: 42
      description: Database identifier backed by a PostgreSQL BIGINT.

    JakartaDateTime:
      type: string
      format: date-time
      example: "2026-09-23T10:15:30+07:00"
      description: RFC 3339 timestamp with an explicit offset or Z. Outlet timezone changes do not rewrite this instant.

    LocalDate:
      type: string
      format: date
      example: "2026-09-23"
      description: ISO 8601 calendar date interpreted in Asia/Jakarta.

    RupiahAmount:
      type: integer
      format: int64
      minimum: 0
      example: 25000
      description: Exact whole-rupiah amount. Fractional rupiah values are not accepted.
    RupiahAmountPositive:
      type: integer
      format: int64
      minimum: 1
      description: Positive exact whole-rupiah amount.

    DecimalQuantity:
      type: string
      pattern: "^[0-9]{1,9}(\\.[0-9]{1,3})?$"
      example: "1.250"
      description: Positive decimal quantity with up to three fractional digits, encoded as a string for exact transport.

    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
