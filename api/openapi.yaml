      operationId: listOutlets
      summary: List outlets in the authenticated business
      tags: [Outlets and staff]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Business outlets and pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutletList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createOutlet
      summary: Create an outlet in the authenticated business
