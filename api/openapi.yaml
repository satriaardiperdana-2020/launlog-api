        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token supplied as `Authorization: Bearer <token>`."

  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of records per page, capped at 100.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing, expired, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist in the authenticated business.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with a business invariant or unique constraint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests were made in the allowed time window.
      headers:
        Retry-After:
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The authentication request body exceeds 4096 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    EntityId:
      type: integer
      format: int64
      minimum: 1
      example: 42
      description: Database identifier backed by a PostgreSQL BIGINT.

    JakartaDateTime:
      type: string
      format: date-time
      example: "2026-09-23T10:15:30+07:00"
      description: RFC 3339 timestamp with an explicit offset, normally Asia/Jakarta (`+07:00`).

    LocalDate:
      type: string
      format: date
      example: "2026-09-23"
      description: ISO 8601 calendar date interpreted in Asia/Jakarta.

    RupiahAmount:
      type: integer
      format: int64
      minimum: 0
      example: 25000
      description: Exact whole-rupiah amount. Fractional rupiah values are not accepted.
    RupiahAmountPositive:
      type: integer
      format: int64
      minimum: 1
      description: Positive exact whole-rupiah amount.

    DecimalQuantity:
      type: string
      pattern: "^[0-9]{1,9}(\\.[0-9]{1,3})?$"
      example: "1.250"
      description: Positive decimal quantity with up to three fractional digits, encoded as a string for exact transport.

    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
