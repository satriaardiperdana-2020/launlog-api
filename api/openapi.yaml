      description: Uses the business timezone stored for the outlet (currently Asia/Jakarta). Payments are summed from rows whose status is CONFIRMED by confirmed_at; expenses are summed by expense_at. Child tables are aggregated independently. This reports gross confirmed receipts and does not implement or net refunds.
      tags: [Dashboard]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EntityId" }
      responses:
        "200":
          description: Outlet dashboard for its current local calendar day.
          content: { application/json: { schema: { $ref: "#/components/schemas/OutletDashboard" } } }
