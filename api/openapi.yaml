      summary: List paginated order history for a customer
      description: Reads existing orders rows and includes cancelled orders. Results are ordered by order creation time and ID. LAUNDRY_STAFF must have both CUSTOMERS_READ and ORDERS_READ and sees only orders from currently assigned active outlets. History remains accessible for a deactivated customer.
      tags: [Customers]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EntityId" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Order page and pagination metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrderHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /outlets:
