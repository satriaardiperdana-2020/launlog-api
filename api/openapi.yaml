      required: [outlet, business_date, timezone, payments, expenses]
      properties:
        outlet: { $ref: "#/components/schemas/Outlet" }
        business_date: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Jakarta] }
        payments:
          type: object
          required: [confirmed_count, confirmed_total_amount]
          properties:
            confirmed_count: { type: integer, format: int64, minimum: 0 }
            confirmed_total_amount: { type: integer, format: int64, minimum: 0, description: Exact whole rupiah from confirmed received payments. Gross receipts; refunds are not implemented by this endpoint. }
        expenses:
          type: object
          required: [count, total_amount]
          properties:
            count: { type: integer, format: int64, minimum: 0 }
            total_amount: { type: integer, format: int64, minimum: 0, description: Exact whole rupiah from expenses whose expense_at falls within the local day. }
    Staff:
      type: object
      required: [id, businessId, email, fullName, role, isActive, outletIds, permissions]
      properties:
        id: { $ref: "#/components/schemas/EntityId" }
        businessId: { $ref: "#/components/schemas/EntityId" }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        isActive: { type: boolean }
        outletIds: { type: array, items: { $ref: "#/components/schemas/EntityId" } }
        permissions: { type: array, items: { type: string } }
    StaffCreate:
      type: object
      additionalProperties: false
      required: [email, fullName, password, outletIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: New-password character policy; server additionally enforces bcrypt's 72 UTF-8 byte limit.
        outletIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/EntityId" }
    StaffUpdate:
      type: object
      additionalProperties: false
      required: [fullName, isActive]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        isActive: { type: boolean }
    StaffList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, business_id, email, full_name, role, is_active]
            properties:
              id: { $ref: "#/components/schemas/EntityId" }
              business_id: { $ref: "#/components/schemas/EntityId" }
              email: { type: string, format: email }
              full_name: { type: string }
              role: { $ref: "#/components/schemas/UserRole" }
              is_active: { type: boolean }
              created_at: { $ref: "#/components/schemas/JakartaDateTime" }
              updated_at: { $ref: "#/components/schemas/JakartaDateTime" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
    OutletAssignmentRequest:
      type: object
      additionalProperties: false
      required: [outletIds]
      properties:
        outletIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/EntityId" }
    OutletAssignmentResponse:
      type: object
      required: [userId, outletIds]
      properties:
        userId: { $ref: "#/components/schemas/EntityId" }
        outletIds:
          type: array
          items: { $ref: "#/components/schemas/EntityId" }
    Permission:
      type: object
      required: [code, description]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
        description: { type: string }
    PermissionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    PermissionGrantSetRequest:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
    PermissionGrantSetResponse:
      type: object
      required: [userId, permissions]
      properties:
        userId: { $ref: "#/components/schemas/EntityId" }
        permissions:
          type: array
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
